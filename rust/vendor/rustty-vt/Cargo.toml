[package]
name = "tmuxx-vendored-rustty-vt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
allocation-probe = []
scalar-kernels = ["rustty-parser/scalar-kernels"]

[dependencies]
rustty-parser = { package = "tmuxx-vendored-rustty-parser", path = "../rustty-parser" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
regex = "1.13"
base64 = "0.22"
png = "0.18"
flate2 = "1.1"
lz4_flex = "0.13"
crc32c = "0.6"
bytemuck = { version = "1.25", features = ["derive"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
wide = "1.7"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"

[lib]
name = "rustty_vt"
