[workspace]
members = ["crates/*"]
exclude = ["vendor/rustty-parser", "vendor/rustty-vt"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "ISC"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
portable-pty = "0.9"
libc = "0.2"
regex = "1.13"
toml = "0.9"

[profile.release]
lto = "thin"

