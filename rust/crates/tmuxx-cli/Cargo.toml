[package]
name = "tmuxx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tmuxx"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
libc.workspace = true
tmuxx-runtime = { path = "../tmuxx-runtime" }
tmuxx-protocol = { path = "../tmuxx-protocol", features = ["native"] }
tmuxx-command = { path = "../tmuxx-command" }

[target.'cfg(unix)'.dependencies]
tmuxx-unix-ipc = { path = "../tmuxx-unix-ipc" }

[dev-dependencies]
portable-pty.workspace = true

