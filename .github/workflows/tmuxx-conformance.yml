name: tmuxx conformance evidence

on:
  pull_request:
    paths: ['rust/**', '*.c', '*.h', '*.y', '*.l', 'regress/**', '.github/workflows/tmuxx-conformance.yml']
  push:
    paths: ['rust/**', '*.c', '*.h', '*.y', '*.l', 'regress/**', '.github/workflows/tmuxx-conformance.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmuxx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    defaults:
      run:
        working-directory: sources/tmux/tmux
    strategy:
      fail-fast: false
      matrix:
        # GNU/Linux server evidence is distinct from the macOS desktop evidence.
        # Windows has its native job below; no Linux desktop is introduced.
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sources/tmux/tmux
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Byron/rustty
          ref: cb67824a77fc00bd20e811cce40012893f79b999
          path: sources/ghostty-org/ghostty
          persist-credentials: false
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake bison libevent libpng ncurses utf8proc pkg-config
      - name: GNU/Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison pkg-config \
            libevent-dev libncurses-dev libutf8proc-dev libpng-dev \
            python3 openssh-client openssh-server libx11-dev libxkbcommon-dev libwayland-dev
          sudo install -d -m 0755 /run/sshd
      - name: Reuse locked Cargo caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sources/tmux/tmux/rust/target
            sources/ghostty-org/ghostty/target
          key: tmuxx-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-${{ hashFiles('sources/tmux/tmux/rust/Cargo.lock', 'sources/tmux/tmux/rust/integration/rustty/manifest.json') }}
          restore-keys: tmuxx-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-
      - name: Rust toolchain
        working-directory: sources/tmux/tmux/rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.95.0
          cargo fetch --locked
      - name: Prepare pinned actual Rustty integration
        run: |
          git -C ../../ghostty-org/ghostty apply --check "$PWD/rust/integration/rustty/rustty.patch"
          git -C ../../ghostty-org/ghostty apply "$PWD/rust/integration/rustty/rustty.patch"
          python3 -c 'import sys; sys.path.insert(0, "rust/conformance"); import runner; runner.rustty_identity()'
          cd ../../ghostty-org/ghostty
          cargo +1.95.0 fetch --locked
      - name: Build pinned current C reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/tmux-current" 22f34d3fa984e03719b0a1b2ac4677aaf61cd53d
          cd "$RUNNER_TEMP/tmux-current"
          sh autogen.sh
          ./configure --enable-utf8proc --enable-images
          make -j"$(getconf _NPROCESSORS_ONLN)"
          test "$(git rev-parse HEAD)" = 22f34d3fa984e03719b0a1b2ac4677aaf61cd53d
          test "$(./tmux -V)" = 'tmux next-3.9'
          echo "TMUXX_C_CURRENT=$PWD/tmux" >> "$GITHUB_ENV"
      - name: Build C 3.7c interoperability reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/tmux-3.7c" 3.7c
          cd "$RUNNER_TEMP/tmux-3.7c"
          sh autogen.sh
          # 3.7c names its retained image decoder --enable-sixel.
          # --enable-images is unrecognized there and silently leaves it off.
          ./configure --enable-utf8proc --enable-sixel
          make -j"$(getconf _NPROCESSORS_ONLN)"
          test "$(git rev-parse HEAD)" = e476c1230b958df0cb12977517d24b3dc931375b
          test "$(./tmux -V)" = 'tmux 3.7c'
          echo "TMUXX_C_OLDER=$PWD/tmux" >> "$GITHUB_ENV"
      - name: Record environment and reference build identities
        run: |
          mkdir -p rust/conformance/artifacts
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys
          sys.path.insert(0, 'rust/conformance')
          import runner
          references = {}
          for role, variable in [('current', 'TMUXX_C_CURRENT'), ('older', 'TMUXX_C_OLDER')]:
              executable = pathlib.Path(os.environ[variable])
              root = executable.parent
              makefile = (root / 'Makefile').read_text()
              defines = re.search(r'^DEFS = (.*)$', makefile, re.MULTILINE).group(1)
              assert '-DHAVE_UTF8PROC=1' in defines.split()
              assert ('-DENABLE_IMAGES=1' if role == 'current' else '-DENABLE_SIXEL=1') in defines.split()
              references[role] = dict(runner.executable_identity(executable),
                  revision=subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip(),
                  configuration=subprocess.check_output(['./config.status', '--config'], cwd=root, text=True).strip(),
                  defines=defines, makefile_sha256=runner.digest(root / 'Makefile'),
                  config_log_sha256=runner.digest(root / 'config.log'))
              (runner.HERE / 'artifacts' / (role + '-config.log')).write_bytes((root / 'config.log').read_bytes())
          (runner.HERE / 'artifacts/environment.json').write_text(json.dumps(
              {'host': runner.host_identity(), 'references': references}, indent=2) + '\n')
          PY
      - name: Build and verify Rust workspace
        working-directory: sources/tmux/tmux/rust
        run: |
          cargo fmt --all -- --check
          cargo build --locked --offline --workspace
          cargo test --locked --offline --workspace --all-targets
          cargo clippy --locked --offline --workspace --all-targets -- -D warnings
      - name: Verify evidence gate and reviewed upstream inventory
        run: |
          python3 rust/conformance/generate_command_metadata.py --check
          python3 rust/conformance/generate_option_metadata.py --check
          python3 rust/conformance/generate_format_metadata.py --check
          python3 -m unittest discover -s rust/conformance -p 'test_*.py'
          python3 rust/conformance/runner.py inventory
      - name: Calibrate C reference against itself
        run: >-
          python3 -u rust/conformance/runner.py smoke
          --reference "$TMUXX_C_CURRENT" --candidate "$TMUXX_C_CURRENT" --candidate-kind c
          --report rust/conformance/artifacts/c-c.json
      - name: Collect exact tests and C/R comparisons
        id: collection
        continue-on-error: true
        run: >-
          python3 -u rust/conformance/runner.py smoke
          --reference "$TMUXX_C_CURRENT" --candidate "$PWD/rust/target/debug/tmuxx" --suite all
          --older-reference "$TMUXX_C_OLDER"
          --report rust/conformance/artifacts/c-rust.json
      - name: Verify 3.7c interoperability and differential behavior
        run: >-
          python3 -u rust/conformance/runner.py smoke
          --reference "$TMUXX_C_OLDER" --candidate "$PWD/rust/target/debug/tmuxx"
          --suite ipc-c-reference --suite config-preparation-c-reference
          --suite parser-text-c-reference --suite regex-c-reference --suite cli-socket-c-reference
          --suite cli-runtime-defaults-c-reference
          --suite scheduler-c-reference --suite source-c-reference
          --suite hooks-after-c-reference --suite options-c-reference
          --suite cli-selector-c-reference
          --suite rustty-system-ssh
          --report rust/conformance/artifacts/c-3.7c-rust.json
      - name: Gate every scoped host profile
        if: always() && steps.collection.outcome != 'skipped'
        run: |
          failed=0
          for profile in command-control system-client native-views standalone app-owned unix-ipc; do
            python3 rust/conformance/runner.py gate \
              --report rust/conformance/artifacts/c-rust.json --profile "$profile" || failed=1
          done
          test '${{ steps.collection.outcome }}' = success || failed=1
          exit "$failed"
      - name: Preserve passing and failing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tmuxx-evidence-${{ matrix.os }}
          path: |
            sources/tmux/tmux/rust/conformance/artifacts/*.json
            sources/tmux/tmux/rust/conformance/artifacts/*-config.log
          if-no-files-found: warn

  windows-native:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: sources/tmux/tmux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: sources/tmux/tmux
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Byron/rustty
          ref: cb67824a77fc00bd20e811cce40012893f79b999
          path: sources/ghostty-org/ghostty
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native MSVC toolchain and integrated Rustty
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup override set 1.95.0
          cargo +1.95.0 fetch --manifest-path rust/Cargo.toml --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $rustty = (Resolve-Path ../../ghostty-org/ghostty).Path
          $patch = (Resolve-Path rust/integration/rustty/rustty.patch).Path
          git -C $rustty apply --check $patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $rustty apply $patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TMUXX_RUSTTY_ROOT = $rustty
          python -c 'import sys; sys.path.insert(0,"rust/conformance"); import runner; runner.rustty_identity()'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 fetch --manifest-path "$rustty/Cargo.toml" --locked
          exit $LASTEXITCODE
      - name: Build shipped standalone and GUI resources
        run: |
          ./rust/windows/build.ps1
          ../../ghostty-org/ghostty/crates/rustty-app/build.ps1
      - name: MSVC workspace checks and cleanup regressions
        run: |
          $env:TMUXX_CONPTY_RESOURCES = (Resolve-Path rust/target/debug/tmuxx/resources).Path
          $env:TMUXX_REMOTE_PYTHON = (& python -c 'import sys; print(sys.executable)').Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # File-type/endpoint vectors require actual Windows symlink access.
          # A missing privilege is a prerequisite failure, never a skipped test.
          python -c 'import pathlib,tempfile; t=tempfile.TemporaryDirectory(); p=pathlib.Path(t.name); (p/"target").write_bytes(b"fixture"); (p/"link").symlink_to(p/"target"); assert (p/"link").read_bytes()==b"fixture"; t.cleanup()'
          if ($LASTEXITCODE) { throw 'Native file-type tests require Windows symlink privilege or Developer Mode.' }
          cargo +1.95.0 fmt --manifest-path rust/Cargo.toml --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --manifest-path rust/Cargo.toml --locked --offline --workspace --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 clippy --manifest-path rust/Cargo.toml --locked --offline --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s rust/conformance -p 'test_*.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python rust/conformance/runner.py inventory
          exit $LASTEXITCODE
      - name: Exact native suites without a fictitious C reference
        run: |
          $env:RUSTUP_TOOLCHAIN = '1.95.0-x86_64-pc-windows-msvc'
          $env:TMUXX_RUSTTY_ROOT = (Resolve-Path ../../ghostty-org/ghostty).Path
          $env:TMUXX_CONPTY_RESOURCES = (Resolve-Path rust/target/debug/tmuxx/resources).Path
          $env:TMUXX_REMOTE_PYTHON = (& python -c 'import sys; print(sys.executable)').Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python rust/conformance/runner.py smoke --no-smoke `
            --candidate rust/target/debug/tmuxx/tmuxx.exe `
            --suite windows-runtime --suite windows-cli `
            --suite command-unit --suite config-unit --suite format-unit --suite windows-format `
            --suite windows-posix-regex --suite windows-core-formats --suite windows-path-formats `
            --suite windows-native-admission --suite windows-source-admission `
            --suite terminal --suite layout --suite control-codec `
            --suite native-snapshot-framing --suite windows-conpty-synchronized-output `
            --suite runtime-host --suite runtime-host-lifetimes --suite runtime-hooks `
            --suite runtime-transactions --suite runtime-scheduler --suite runtime-native-views `
            --suite runtime-native-ui-policy --suite runtime-pane-moves --suite runtime-endpoint-access `
            --suite native-file-type-policy --suite native-stream-consistency --suite native-stdin-files `
            --suite windows-process-native-stdin `
            --suite buffer-native-clipboard-targets --suite native-color-report-restore `
            --suite terminal-history-native-allocation --suite windows-control-pipe-eof `
            --suite rustty-native-adapter --suite rustty-native-workspace `
             --suite rustty-native-ssh-command-config --suite windows-rustty-tmux-driver `
             --suite windows-rustty-concurrent-launcher `
            --suite rustty-system-discovery-recovery `
            --report rust/conformance/artifacts/windows-ci.json
          exit $LASTEXITCODE
      # Hosted CI has no authorized cross-logon fixture or guaranteed interactive
      # desktop. This report is a required subset, never a Windows profile pass.
      # Run windows_ssh.py and windows_native_views.py on the prepared desktop
      # host, collect the complete profile, then invoke runner.py gate --profile
      # windows. Missing desktop/C-reference obligations remain blocking.
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tmuxx-evidence-windows-native
          path: sources/tmux/tmux/rust/conformance/artifacts/**
          if-no-files-found: warn
